    <section class="content" id="reports" aria-labelledby="reports-title">

      <div class="report-grid">
        <button class="report-card" type="button" data-number="01" data-file="제주 수산물 국가별 수출 통계.html" data-title="제주 수산물 주요 6개국·권역 수출입 통계"><span class="card-inner"><span class="card-tag">국가별 통계</span><h3>제주 수산물 주요 6개국 수출입 통계</h3><p>미국·중국·일본·베트남·EU·태국의 월별 수출입 변동을 비교합니다.</p><span class="card-action">자료 열람</span></span></button>

        <button class="report-card" type="button" data-number="03" data-file="제주넙치류수출 동향(1901~2606).html" data-title="제주 넙치류 수출 동향"><span class="card-inner"><span class="card-tag">넙치류 분석</span><h3>제주 넙치류 수출 동향</h3><p>2019년 1월부터 2026년 6월까지 제주 넙치류 수출 실적과 주요 시장의 변화를 분석합니다.</p><span class="card-action">자료 열람</span></span></button>

        <button class="report-card" type="button" data-number="06" data-file="제주_위판장별_판매현황_인터랙티브_보고서.html" data-title="제주 위판장별 판매현황 인터랙티브 보고서"><span class="card-inner"><span class="card-tag">위판장 분석</span><h3>제주 위판장별 판매현황 조회</h3><p>제주 지역 위판장별 판매 현황을 인터랙티브 방식으로 조회하고 비교·분석합니다.</p><span class="card-action">자료 열람</span></span></button>
        <button class="report-card" type="button" data-number="07" data-file="제주수산물_수출건전성_현황판.html" data-title="제주 어류 수출(HS 0301~0303) 건전성 현황판"><span class="card-inner"><span class="card-tag">수출건전성 분석</span><h3>제주 어류 수출 건전성 현황판</h3><p>HS 0301~0303의 동일기간 증감률·지속성·동월비 변동성·넙치 의존도·위기지수를 진단합니다.</p><span class="card-action">자료 열람</span></span></button>
        <button class="report-card" type="button" data-number="08" data-file="일본 활넙치 도매·수입가격 동향.html" data-title="일본 활넙치 도매·수입가격 동향"><span class="card-inner"><span class="card-tag">일본시장 분석</span><h3>일본 활넙치 도매·수입가격 동향</h3><p>일본 활넙치의 도매가격과 수입가격 변화를 비교하여 시장 흐름과 가격 격차를 확인합니다.</p><span class="card-action">자료 열람</span></span></button>
        <button class="report-card" type="button" data-number="09" data-file="미국 수출 부대비용 모니터링.html" data-title="미국 기타 활어(HTS 030199) 수입 부대비용 모니터링"><span class="card-inner"><span class="card-tag">수출비용 분석</span><h3>미국 한국산 활어 수입 부대비용(항공유류할증 영향)</h3><p>HTS 030199 한국산 기타 활어의 미국 도착 전 운임·보험 등 부대비용을 모니터링합니다.</p><span class="card-action">자료 열람</span></span></button>
        <button class="report-card" type="button" data-number="10" data-file="jeju_seafood_export_certification_report_2026.html" data-title="제주 수산물 수출 인증제도"><span class="card-inner"><span class="card-tag">수출인증 안내</span><h3>제주 수산물 수출 인증제도(AI생성 보고서)</h3><p>2026년 제주 수산물 수출에 필요한 주요 인증제도와 검역·통관 요건을 정리했습니다.</p><span class="card-action">자료 열람</span></span></button>
        <button class="report-card" type="button" data-number="11" data-file="미국_수산물_국가별_수입동향_정밀분석.html" data-title="미국 수산물 국가별 수입동향 정밀분석"><span class="card-inner"><span class="card-tag">미국시장 분석</span><h3>미국 수산물 국가별 수입동향 정밀분석</h3><p>미국 수산물 수입시장의 국가별 동향과 주요 공급국 변화를 정밀 분석합니다.</p><span class="card-action">자료 열람</span></span></button>
        <button class="report-card" type="button" data-number="12" data-file="제주 금어기 TAC 금지체장 정리표.html" data-title="제주 금어기 TAC 금지체장 정리표"><span class="card-inner"><span class="card-tag">어업관리 제도</span><h3>제주 금어기 TAC 금지체장 정리표(AI생성 보고서)</h3><p>제주 주요 수산자원의 금어기·TAC·금지체장 관련 기준을 한눈에 확인할 수 있도록 정리합니다.</p><span class="card-action">자료 열람</span></span></button>
        <button class="report-card" type="button" data-number="13" data-file="제주 산지수협별 위판자료 정밀분석.html" data-title="제주 산지수협별 위판자료 정밀분석"><span class="card-inner"><span class="card-tag">수협 위판 분석</span><h3>제주 산지수협별 위판자료 정밀분석(AI생성 보고서)</h3><p>제주 산지수협별 위판자료를 비교해 어종·물량·금액 등 주요 위판 흐름을 정밀 분석합니다.</p><span class="card-action">자료 열람</span></span></button>

    <section class="viewer" id="viewer" aria-live="polite" aria-label="선택한 분석자료"><div class="viewer-shell">
      <div class="viewer-toolbar"><p class="viewer-title" id="viewer-title">분석자료</p><div class="viewer-actions"><a class="viewer-button" id="open-new" href="#" target="_blank" rel="noopener">새 창에서 열기</a><button class="viewer-button" id="close-viewer" type="button">닫기</button></div></div>

  <footer>제주 수산물 통합 보고서 · 보고서별 기준일 확인 필요</footer>
  <script>
    (()=>{const cards=[...document.querySelectorAll(".report-card")],viewer=document.getElementById("viewer"),frame=document.getElementById("report-frame"),title=document.getElementById("viewer-title"),openNew=document.getElementById("open-new"),close=document.getElementById("close-viewer");
    function openReport(file,reportTitle,updateHash=true){frame.src=file;frame.title=reportTitle;title.textContent=reportTitle;openNew.href=file;viewer.classList.add("is-visible");if(updateHash)history.replaceState(null,"","#report="+encodeURIComponent(file));requestAnimationFrame(()=>viewer.scrollIntoView({behavior:"smooth",block:"start"}))}
    function closeReport(){viewer.classList.remove("is-visible");frame.removeAttribute("src");history.replaceState(null,"",location.pathname+location.search);document.getElementById("reports-title").scrollIntoView({behavior:"smooth",block:"start"})}
    cards.forEach(card=>card.addEventListener("click",()=>openReport(card.dataset.file,card.dataset.title)));close.addEventListener("click",closeReport);const match=location.hash.match(/^#report=(.+)$/);if(match){const requested=decodeURIComponent(match[1]),card=cards.find(item=>item.dataset.file===requested);if(card)openReport(card.dataset.file,card.dataset.title,false)}})();
  </script>
